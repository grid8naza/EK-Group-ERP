# Development overrides: run the frontend with Next.js dev server + HMR.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#
# The frontend source is bind-mounted, so edits hot-reload instantly with no
# image rebuild. db and backend run from their normal builds.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erpgrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpgrip}
      POSTGRES_DB: ${POSTGRES_DB:-erpgrip}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - erpgrip_db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-erpgrip} -d ${POSTGRES_DB:-erpgrip}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Build the image (for prisma engines / node_modules), but run the NestJS
    # watch server against the bind-mounted source so backend edits hot-reload.
    build:
      context: ./backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && npm run seed && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erpgrip}:${POSTGRES_PASSWORD:-erpgrip}@db:5432/${POSTGRES_DB:-erpgrip}?schema=public
      BACKEND_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-superadmin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Administrator}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@erpgrip.local}
      SEED_HIGH_SECURITY_PASSWORD: ${SEED_HIGH_SECURITY_PASSWORD:-Backup@123}
      # Backups land in ./backend/backups on the host (via the bind mount below).
      BACKUP_DIR: /app/backups
      # Poll the filesystem so the TypeScript watcher picks up edits made on
      # the Windows host (inotify events don't cross the bind mount).
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./backend:/app
      # Keep the image's node_modules and generated Prisma client.
      - /app/node_modules
    ports:
      - '${BACKEND_PORT:-4000}:4000'

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      # Poll the filesystem so edits on the Windows host are picked up inside
      # the Linux container (native inotify events don't cross the bind mount).
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules isolated from the host.
      - /app/node_modules
      - /app/.next
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  erpgrip_db:
